{% assign current = page.url %}
<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand__mark" src="{{ '/assets/favicon.svg' | relative_url }}" alt="" width="32" height="32">
      <span class="brand__name">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}"{% if current == '/' %} aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/posts/' | relative_url }}"{% if current contains '/posts/' %} aria-current="page"{% endif %}>Reviews</a>
      <a href="{{ '/how-i-rate/' | relative_url }}"{% if current == '/how-i-rate/' %} aria-current="page"{% endif %}>How I rate</a>
      <a href="{{ '/about/' | relative_url }}"{% if current == '/about/' %} aria-current="page"{% endif %}>About</a>
    </nav>
  </div>
</header>
