---
layout: default
---
<article class="static">
  <header class="page-hero">
    <div class="wrap wrap--narrow">
      <h1 class="page-hero__title">{{ page.title }}</h1>
      {% if page.lede %}<p class="page-hero__lede">{{ page.lede }}</p>{% endif %}
    </div>
  </header>
  <div class="wrap wrap--narrow prose static__body">
    {{ content }}
  </div>
</article>
